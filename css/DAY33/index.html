<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 33 - Responsive Mobile-First Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content-wrapper">
    <header class="site-header">
      <h1>Kushal's Responsive Hub</h1>
      <p class="device-tag">Resize screen to see layout adapt!</p>
    </header>

    <div class="layout-body">
      <aside class="sidebar">Sidebar Menu (Stacks on phone, sits left on desktop)</aside>
      <main class="main-content">
        <h2>Mobile First Rocks!</h2>
        <p>On mobile phones, this page is a clean single-column. Above 768px, it expands to 2 columns.</p>
      </main>
    </div>
  </div>

  <hr>
  <p><a href="breakpoint-indicator.html">Check Screen Breakpoint Visualizer &rarr;</a></p>
</body>
</html>
