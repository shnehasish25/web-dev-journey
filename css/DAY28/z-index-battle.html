<!DOCTYPE html>
<html>
<head><title>Z-Index</title></head>
<body style="font-family: sans-serif; padding: 30px;">
  <div style="position: relative; z-index: 1; width: 100px; height: 100px; background: red; color: white; padding: 10px;">Layer 1</div>
  <div style="position: relative; z-index: 2; width: 100px; height: 100px; background: blue; color: white; padding: 10px; margin-top: -50px; margin-left: 50px;">Layer 2 (On top!)</div>
</body>
</html>
