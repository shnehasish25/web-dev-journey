<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 30 - Pricing Cards</title>
  <style>
    body { font-family: sans-serif; padding: 30px; background: #f1f5f9; }
    .pricing-container { display: flex; gap: 20px; max-width: 800px; margin: 0 auto; align-items: center; }
    .plan { flex: 1; background: white; padding: 24px; border-radius: 8px; text-align: center; }
    .featured { flex: 1.2; border: 2px solid #4f46e5; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <div class="pricing-container">
    <div class="plan"><h3>Student</h3><p>₹199 / mo</p></div>
    <div class="plan featured"><h3>Pro Dev (Popular)</h3><p>₹499 / mo</p></div>
    <div class="plan"><h3>Startup</h3><p>₹999 / mo</p></div>
  </div>
</body>
</html>
