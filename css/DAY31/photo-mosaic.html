<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 31 - Mosaic Spanning</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .mosaic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; }
    .tile { background: #3b82f6; color: white; padding: 20px; border-radius: 4px; text-align: center; }
    .big { grid-column: span 2; grid-row: span 2; background: #ef4444; }
  </style>
</head>
<body>
  <div class="mosaic">
    <div class="tile big">Featured Hero Monument (Spans 2x2)</div>
    <div class="tile">Photo 2</div>
    <div class="tile">Photo 3</div>
    <div class="tile">Photo 4</div>
    <div class="tile">Photo 5</div>
  </div>
</body>
</html>
