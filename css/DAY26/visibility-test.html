<!DOCTYPE html>
<html>
<head><title>Visibility vs Display</title></head>
<body style="font-family: sans-serif; padding: 20px;">
  <div style="display: none;">You cannot see me and I take 0 space.</div>
  <div style="visibility: hidden; height: 50px; background: red;">I am invisible but leave a 50px hole!</div>
  <div style="background: #e2e8f0; padding: 10px;">Next element sits right here.</div>
</body>
</html>
