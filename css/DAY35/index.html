<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day 35 - CSS Transforms</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Transforms Playground</h1>

  <div class="cards-row">
    <div class="box box-scale">Hover to Scale (1.1x)</div>
    <div class="box box-rotate">Hover to Rotate (10deg)</div>
  </div>

  <hr style="margin: 30px 0;">
  <h2>3D Flip Card (Student ID &rarr; Library Barcode)</h2>
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <h3>Kushal Sharma</h3>
        <p>College Student</p>
        <p><small>(Hover to flip)</small></p>
      </div>
      <div class="flip-card-back">
        <h3>Library Access</h3>
        <p>USN: CS-2024-089</p>
        <p>BARCODE: ||| |||| | |||||</p>
      </div>
    </div>
  </div>
</body>
</html>
