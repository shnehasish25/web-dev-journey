<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 10 - Bangalore Dev Club Signup</title>
</head>
<body>

  <a href="login.html">&larr; Back to Login</a>
  <hr>

  <h1>Join the Bengaluru Student Developers Community</h1>
  <p>Fill out the form below to get notified about weekend hackathons and meetups.</p>

  <form action="#" method="POST">

    <p>
      <label for="full-name">Full Name: *</label><br>
      <input type="text" id="full-name" name="name" placeholder="Kushal Sharma" required>
    </p>

    <p>
      <label for="email-address">College / Personal Email: *</label><br>
      <input type="email" id="email-address" name="email" placeholder="kushal@college.edu.in" required>
    </p>

    <p>
      <label for="college-name">College / University Name:</label><br>
      <input type="text" id="college-name" name="college" placeholder="engineering college">
    </p>

    <p>
      <label for="grad-year">Expected Graduation Year:</label><br>
      <input type="number" id="grad-year" name="graduation_year" min="2024" max="2028" value="2026">
    </p>

    <p>
      <label for="github-handle">GitHub Profile URL:</label><br>
      <input type="url" id="github-handle" name="github" placeholder="https://github.com/kushal-dev">
    </p>

    <p>
      <button type="submit">Complete Registration</button>
    </p>

  </form>

  <p><a href="contact-kushal.html">Check Contact Form &rarr;</a></p>

</body>
</html>
