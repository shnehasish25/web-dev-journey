<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 12 - Indian KYC & ID Verification Form</title>
</head>
<body>

  <h1>Day 12: HTML5 Form Validation &amp; Regex</h1>
  <p>By Kushal | Practicing pattern attribute for Indian ID verification.</p>

  <hr>

  <form action="#" method="POST">

    <fieldset>
      <legend><strong>Identity Verification (KYC)</strong></legend>

      <p>
        <label for="full-legal-name">Full Legal Name (as on Aadhaar card): *</label><br>
        <input 
          type="text" 
          id="full-legal-name" 
          name="legal_name" 
          required 
          minlength="3" 
          maxlength="50"
          placeholder="Kushal Sharma"
        >
      </p>

      <p>
        <label for="indian-mobile">Mobile Number (Must be 10 digits starting 6-9): *</label><br>
        <!-- Regex for Indian mobile numbers -->
        +91 <input 
          type="tel" 
          id="indian-mobile" 
          name="mobile" 
          required 
          pattern="[6-9][0-9]{9}" 
          placeholder="9876543210"
          title="Please enter a valid 10-digit Indian mobile number starting with 6, 7, 8, or 9"
        >
      </p>

      <p>
        <label for="pan-card">Income Tax PAN Card Number: *</label><br>
        <!-- Regex for standard Indian PAN format: 5 letters, 4 numbers, 1 letter -->
        <input 
          type="text" 
          id="pan-card" 
          name="pan" 
          required 
          pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}" 
          placeholder="ABCDE1234F" 
          style="text-transform: uppercase;"
          title="PAN format must be 5 capital letters, 4 digits, and 1 letter (e.g. ABCDE1234F)"
        >
      </p>

      <p>
        <label for="pincode">6-Digit Postal PIN Code: *</label><br>
        <!-- Regex for Indian PIN Code -->
        <input 
          type="text" 
          id="pincode" 
          name="pincode" 
          required 
          pattern="[1-9][0-9]{5}" 
          placeholder="560001"
          title="Indian PIN Code must be exactly 6 digits not starting with 0"
        >
      </p>

      <p>
        <button type="submit">Verify &amp; Proceed &rarr;</button>
      </p>

    </fieldset>

  </form>

  <hr>
  <p><a href="appointment-booking.html">Check Doctor Appointment Booking Form &rarr;</a></p>

</body>
</html>
