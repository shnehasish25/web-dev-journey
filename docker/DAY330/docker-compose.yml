services:
  db:
    image: postgres:16-alpine
    container_name: healthy-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: delivery_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delivery_db"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    image: alpine:3.19
    container_name: healthy-consumer
    command: sh -c "echo 'DB is healthy! Connecting now...' && sleep 3600"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
