# QuickBite Production Multi-Tier Stack
services:
  gateway:
    image: nginx:1.25-alpine
    container_name: quickbite-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickbite-frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickbite-backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://quickbite_admin:bengaluru_secret@database:5432/quickbite_db
      - REDIS_URL=redis://cache:6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    container_name: quickbite-database
    environment:
      POSTGRES_USER: quickbite_admin
      POSTGRES_PASSWORD: bengaluru_secret
      POSTGRES_DB: quickbite_db
    volumes:
      - quickbite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite_admin -d quickbite_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: quickbite-cache
    volumes:
      - quickbite_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  quickbite_pgdata:
  quickbite_redisdata:
