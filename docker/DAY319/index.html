<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Delivery Partner Portal - Dockerized Nginx</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .card { background: white; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 6px solid #fc8019; }
        h1 { color: #fc8019; margin-top: 0; }
        .badge { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; }
        .meta { margin-top: 20px; font-size: 14px; color: #555; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Swiggy Rider Ops</h1>
        <span class="badge">● Container Healthy (Port 80)</span>
        <div class="meta">
            <p><strong>Hub Location:</strong> Koramangala 5th Block, Bengaluru</p>
            <p><strong>Server Engine:</strong> Alpine Nginx Reverse Proxy</p>
            <p><strong>Port Mapping:</strong> Host 8080 &rarr; Container 80</p>
        </div>
    </div>
</body>
</html>
