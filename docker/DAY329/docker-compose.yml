services:
  api:
    build: .
    container_name: payment-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/payment_db
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: payment_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  adminer:
    image: adminer:latest
    container_name: payment-db-gui
    ports:
      - "8080:8080"
    restart: always

volumes:
  pgdata:
